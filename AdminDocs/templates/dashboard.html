<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monarca Docs: Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 sidebar d-flex flex-column" style="height: 100vh;">
                <a href="/dashboard">
                    <img src="{{ url_for('static', filename='Logo-Monarca-Home-Admin2.png') }}" alt="Logo"
                        class="logo mb-4">
                </a>
                <h5 class="mb-4"><a href="/dashboard" class="link-dashboard">Monarca Docs</a></h5>
                <nav class="nav flex-column">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a href="/documentos" class="nav-link text-white mb-3">
                                <i class="bi bi-files me-2"></i>Documentos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="/logout" class="nav-link text-white">
                                <i class="bi bi-box-arrow-left me-2"></i>Cerrar Sesión
                            </a>
                        </li>
                    </ul>
                </nav>
                <div class="mt-auto text-white">
                    <hr>
                    <p>
                        <strong>Usuario:</strong> {{ user.username }}
                        |
                        <strong>Rango:</strong> {{ user.rank }}
                    </p>
                </div>
            </div>

            <div class="col-md-9 col-lg-10 main-content">
                <h1>Bienvenido Admin</h1>
                <hr>

                <div id="documentsByStatusData" data-json='{{ documents_by_status | tojson }}' style="display:none;">
                </div>
                <div id="documentsByCategoryData" data-json='{{ documents_by_category | tojson }}'
                    style="display:none;"></div>

                <div class="row mb-5">
                    <div class="col-md-6">
                        <h5 class="text-center mb-3">Documentos por Estatus</h5>
                        <div style="height: 300px; width: 100%;">
                            <canvas id="statusChart"></canvas>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <h5 class="text-center mb-3">Documentos por Categoría</h5>
                        <div style="height: 300px; width: 100%;">
                            <canvas id="categoryChart"></canvas>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Retrieve data from hidden divs and parse JSON
        const documentsByStatusElement = document.getElementById('documentsByStatusData');
        const documentsByStatus = JSON.parse(documentsByStatusElement.dataset.json);

        const documentsByCategoryElement = document.getElementById('documentsByCategoryData');
        const documentsByCategory = JSON.parse(documentsByCategoryElement.dataset.json);


        // --- Chart for Documents by Status (Pie Chart) ---
        const statusCtx = document.getElementById('statusChart').getContext('2d');
        new Chart(statusCtx, {
            type: 'pie',
            data: {
                labels: Object.keys(documentsByStatus),
                datasets: [{
                    data: Object.values(documentsByStatus),
                    backgroundColor: [
                        'rgba(255, 99, 132, 0.7)', // Red (e.g., Pending)
                        'rgba(75, 192, 192, 0.7)', // Green (e.g., Approved)
                        'rgba(255, 206, 86, 0.7)', // Yellow (e.g., Rejected)
                        'rgba(54, 162, 235, 0.7)', // Blue (Other)
                        'rgba(153, 102, 255, 0.7)' // Purple (Other)
                    ],
                    borderColor: [
                        'rgba(255, 99, 132, 1)',
                        'rgba(75, 192, 192, 1)',
                        'rgba(255, 206, 86, 1)',
                        'rgba(54, 162, 235, 1)',
                        'rgba(153, 102, 255, 1)'
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false, // Important for flexible sizing
                plugins: {
                    legend: {
                        position: 'top',
                    },
                    title: {
                        display: false, // Title handled by H5 HTML element
                    }
                }
            }
        });

        // --- Chart for Documents by Category (Bar Chart) ---
        const categoryCtx = document.getElementById('categoryChart').getContext('2d');
        new Chart(categoryCtx, {
            type: 'bar',
            data: {
                labels: Object.keys(documentsByCategory),
                datasets: [{
                    label: 'Número de Documentos',
                    data: Object.values(documentsByCategory),
                    backgroundColor: [
                        'rgba(255, 159, 64, 0.7)',  // Orange
                        'rgba(54, 162, 235, 0.7)',  // Blue
                        'rgba(75, 192, 192, 0.7)',  // Green
                        'rgba(153, 102, 255, 0.7)', // Purple
                        'rgba(201, 203, 207, 0.7)', // Gray
                        'rgba(255, 99, 132, 0.7)'   // Red
                    ],
                    borderColor: [
                        'rgba(255, 159, 64, 1)',
                        'rgba(54, 162, 235, 1)',
                        'rgba(75, 192, 192, 1)',
                        'rgba(153, 102, 255, 1)',
                        'rgba(201, 203, 207, 1)',
                        'rgba(255, 99, 132, 1)'
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false, // Important for flexible sizing
                plugins: {
                    legend: {
                        display: false // No legend needed for single dataset bar chart
                    },
                    title: {
                        display: false, // Title handled by H5 HTML element
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            precision: 0 // Ensure y-axis ticks are integers
                        }
                    }
                }
            }
        });
    </script>
</body>

</html>
