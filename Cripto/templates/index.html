<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IDE de Documentos</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <!-- Incluir PDF.js -->
  <script src="https://mozilla.github.io/pdf.js/build/pdf.js"></script>
</head>
<body>
  <div class="logo-container">
    <img src="{{ url_for('static', filename='imgs/logo_monarca2.png') }}" alt="Logo Monarca">
  </div>
  <header>
    <h1>IDE de Documentos</h1>
  </header>
  <div class="container">
    <aside class="sidebar">
      <h2>Documentos</h2>
      <ul id="documentList">
        <!-- Lista generada dinámicamente -->
      </ul>
      <hr>
      <h3>Subir documento</h3>
      <form id="uploadForm">
        <input type="file" name="file" accept=".pdf" required>
        <select name="status">
          <option value="sin_firmar">Sin Firmar</option>
          <option value="firmado">Firmado</option>
        </select>
        <button type="submit">Subir</button>
      </form>
      <div id="uploadMessage"></div>
    </aside>
    <main class="main-view">
      <canvas id="pdfPreview"></canvas>
    </main>
  </div>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
