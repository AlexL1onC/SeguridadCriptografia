<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monarca Docs | Ver Documento | {{ doc.filename }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='user_style.css') }}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 sidebar d-flex flex-column" style="height: 100vh;">
                <a href="{{ url_for('user.dashboard') }}">
                    <img src="{{ url_for('static', filename='user_Logo-Monarca-Home.png') }}" alt="Logo" class="logo mb-4">
                </a>
                <h5 class="mb-4">
                    <a href="{{ url_for('user.dashboard') }}" class="link-dashboard">Monarca Docs</a>
                </h5>
                <nav class="nav flex-column">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a href="{{ url_for('user.enviar_documento') }}" class="nav-link text-white mb-3">
                                <i class="bi bi-send me-2"></i>Enviar Documento
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="{{ url_for('user.mis_documentos') }}" class="nav-link text-white mb-3">
                                <i class="bi bi-files me-2"></i>Mis Documentos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="{{ url_for('auth.logout') }}" class="nav-link text-white">
                                <i class="bi bi-box-arrow-left me-2"></i>Cerrar Sesión
                            </a>
                        </li>
                    </ul>
                </nav>
                <div class="mt-auto text-white">
                    <hr>
                    <p>
                        <strong>Usuario:</strong> {{ user.username }}
                        |
                        <strong>Rango:</strong> {{ user.rank }}
                    </p>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 main-content">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <h1 class="mb-0">{{ doc.filename }}</h1>
                        <div class="mt-2">
                            <span class="badge {% if doc.status == 'pending' %}bg-warning text-dark{% elif doc.status == 'approved' %}bg-success{% else %}bg-danger{% endif %} me-2">
                                {% if doc.status == 'pending' %}En Proceso
                                {% elif doc.status == 'approved' %}Aprobado
                                {% else %}Rechazado{% endif %}
                            </span>
                            <span class="text-muted">{{ doc.category }}</span>
                        </div>
                    </div>
                    <div>
                        <a href="{{ url_for('user.mis_documentos') }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left me-2"></i>Volver
                        </a>
                    </div>
                </div>

                <hr>

                <!-- Document Preview -->
                <div style="height: calc(100vh - 180px);">
                    <iframe src="{{ url_for('user.serve_documento', doc_id=doc.id) }}" 
                            width="100%" 
                            height="100%"
                            class="border rounded shadow-sm">
                    </iframe>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
