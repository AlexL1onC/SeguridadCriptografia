<!-- templates/firmar_documento.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monarca Docs | Aprobar Documento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='user_style.css') }}">

</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Incluir la misma sidebar desde dashboard.html -->
             <div class="col-md-3 col-lg-2 sidebar d-flex flex-column" style="height: 100vh;">
                <a href="{{ url_for('user.dashboard') }}"><img src="{{ url_for('static', filename='user_Logo-Monarca-Home.png') }}" alt="Logo"
                        class="logo mb-4"></a>
                <nav class="nav flex-column">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a href="{{ url_for('user.dashboard') }}" class="nav-link text-white mb-3">
                                <i class="bi bi-house-door me-2"></i>Monarca Docs
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="{{ url_for('user.enviar_documento') }}" class="nav-link text-white mb-3">
                                <i class="bi bi-send me-2"></i>Enviar Documento
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="{{ url_for('user.mis_documentos') }}" class="nav-link text-white mb-3">
                                <i class="bi bi-files me-2"></i>Mis Documentos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="{{ url_for('auth.logout') }}" class="nav-link text-white">
                                <i class="bi bi-box-arrow-left me-2"></i>Cerrar Sesión
                            </a>
                        </li>
                    </ul>
                </nav>
                <div class="mt-auto text-white">
                    <hr>
                    <p>
                        <strong>Usuario:</strong> {{ user.username }}
                        |
                        <strong>Rango:</strong> {{ user.rank }}
                    </p>
                </div>
            </div>
            
            <!-- Contenido principal -->
            <div class="col-md-9 col-lg-10 main-content">
                <h1>Firmar Documento</h1>
                <hr>
                
                <!-- PDF -->
                <div class="mb-4">
                    <iframe 
                        src="{{ url_for('user.serve_documento', doc_id=doc.id) }}"
                        width="100%" 
                        height="500px">
                    </iframe>
                </div>

                <!-- Área de firma -->
                <form action="{{ url_for('user.procesar_firma', doc_id=doc.id) }}" method="POST">                    
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save me-2"></i>Guardar Firma y Aprobar
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
