{% extends "base.html" %}
{% block content %}
<div class="container py-4">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Editar aprobadores para: <span class="fw-normal">{{ doc.filename }}</span></h4>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label"><strong>Selecciona los aprobadores:</strong></label>
                    <div class="row">
                        {% for user in usuarios %}
                        <div class="col-md-4 mb-2">
                            <div class="user-card py-2 px-3 border rounded {% if user.id in aprobadores_actuales %}bg-light{% endif %}">
                                <label class="d-flex align-items-center mb-0 w-100">
                                    <input type="checkbox" name="approvers" value="{{ user.id }}"
                                        class="form-check-input me-2"
                                        {% if user.id in aprobadores_actuales %}checked{% endif %}>
                                    <div>
                                        <strong>{{ user.username }}</strong>
                                        <span class="text-muted small">- Nivel {{ user.rank }}</span>
                                        {% if user.area %}
                                            <span class="badge bg-secondary ms-2">{{ user.area }}</span>
                                        {% endif %}
                                    </div>
                                </label>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-save me-1"></i>Guardar
                    </button>
                    <a href="{{ url_for('admin.documentos') }}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
