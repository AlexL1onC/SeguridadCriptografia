<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>
    <h1>Bienvenido {{ user.username }}</h1>
    
    <button onclick="window.location.href='/enviar_documento'">Enviar Documento</button>
    
    <h2>Documentos por aprobar:</h2>
    {% for doc in documentos %}
    <div>
        {{ doc.filename }}
        <button onclick="window.location.href='/aprobar_documento/{{ doc.id }}'">Aprobar</button>
    </div>
    {% endfor %}
</body>
</html>
