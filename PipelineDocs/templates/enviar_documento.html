<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Enviar Documento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 sidebar d-flex flex-column" style="height: 100vh;">
                <a href="/dashboard"><img src="{{ url_for('static', filename='Logo-Monarca-Home.png') }}" alt="Logo"
                        class="logo mb-4"></a>
                <h5 class="mb-4"><a href="/dashboard" class="link-dashboard">Monarca Docs</a></h5>
                <nav class="nav flex-column">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a href="/enviar_documento" class="nav-link active mb-3">
                                <i class="bi bi-send me-2"></i>Enviar Documento
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="/mis_documentos" class="nav-link text-white mb-3">
                                <i class="bi bi-files me-2"></i>Mis Documentos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="/logout" class="nav-link text-white">
                                <i class="bi bi-box-arrow-left me-2"></i>Cerrar Sesión
                            </a>
                        </li>
                    </ul>
                </nav>
                <div class="mt-auto text-white">
                    <hr>
                    <p>
                        <strong>Usuario:</strong> {{ user.username }}
                        |
                        <strong>Rango:</strong> {{ user.rank }}
                    </p>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 main-content">

                <h1>Enviar Nuevo Documento</h1>
                <hr>

                <div class="container py-5">
                    <div class="upload-container">
                        <form method="POST" enctype="multipart/form-data">
                            <!-- File Upload -->
                            <div class="file-upload">
                                <input type="file" name="documento" class="form-control" required>
                            </div>

                            <!-- Approvers Selection -->
                            <h4 class="mt-5 mb-3">Seleccionar Destinatarios</h4>

                            <div class="row">
                                {% for user in users %}
                                <div class="col-md-6">
                                    <div class="user-card">
                                        <input class="form-check-input me-3" type="checkbox" name="approvers"
                                            value="{{ user.id }}">
                                        <div>
                                            <h5 class="mb-0">{{ user.username }}</h5>
                                            <small class="text-muted">Rango {{ user.rank }}</small>
                                        </div>
                                    </div>
                                </div>
                                {% endfor %}
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid mt-5">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-send me-2"></i>Enviar Documento
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
