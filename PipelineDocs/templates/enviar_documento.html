<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Enviar Documento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .upload-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }
        
        .file-upload {
            border: 2px dashed #ddd;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            margin: 20px 0;
            transition: all 0.3s ease;
        }
        
        .file-upload:hover {
            border-color: var(--accent-color);
            background: #f8f9fa;
        }
        
        .user-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="upload-container">
            <h2 class="mb-4">Enviar Nuevo Documento</h2>
            
            <form method="POST" enctype="multipart/form-data">
                <!-- File Upload -->
                <div class="file-upload">
                    <input type="file" name="documento" class="form-control" required>
                </div>

                <!-- Approvers Selection -->
                <h4 class="mt-5 mb-3">Seleccionar Destinatarios</h4>
                
                <div class="row">
                    {% for user in users %}
                    <div class="col-md-6">
                        <div class="user-card">
                            <input class="form-check-input me-3" 
                                   type="checkbox" 
                                   name="approvers" 
                                   value="{{ user.id }}">
                            <div>
                                <h5 class="mb-0">{{ user.username }}</h5>
                                <small class="text-muted">Rango {{ user.rank }}</small>
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                </div>

                <!-- Submit Button -->
                <div class="d-grid mt-5">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="bi bi-send me-2"></i>Enviar Documento
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
