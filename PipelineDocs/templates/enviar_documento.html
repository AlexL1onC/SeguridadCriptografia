<!DOCTYPE html>
<html>
<head>
    <title>Enviar Documento</title>
</head>
<body>
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="documento" required>
        
        <h3>Seleccionar destinatarios:</h3>
        {% for user in users %}
        <label>
            <input type="checkbox" name="approvers" value="{{ user.id }}">
            {{ user.username }} (Rango {{ user.rank }})
        </label><br>
        {% endfor %}
        
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
